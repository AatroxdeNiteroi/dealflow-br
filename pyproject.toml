[project]
name = "dealflow"
version = "0.2.0"
description = "Genesis Radar — motor de estimativa de faturamento RJ/SP via Match RAIS (produto da Genesis Labs Ltda.). Nome do pacote 'dealflow' mantido por compatibilidade com setups existentes."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.1",
    "polars>=1.12",
    "pyarrow>=18",
    "httpx>=0.27",
    "tqdm>=4.66",
    "streamlit>=1.40",
    "altair>=5.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.7",
]
notebook = [
    "jupyterlab>=4",
    "ipykernel>=6",
]
# Necessário só para regenerar data/estimates_v2.parquet a partir do BigQuery.
# Usuário final que só roda a UI a partir do parquet commitado não precisa instalar.
export = [
    "google-cloud-bigquery>=3.25",
    "google-cloud-bigquery-storage>=2.27",
    "db-dtypes>=1.3",
    "python-dotenv>=1.0",  # auto-carrega .env.local com DEALFLOW_SOCIOS_SALT
]
viz = [
    "matplotlib>=3.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dealflow"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
