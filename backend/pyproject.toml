[project]
name = "dealflow-api"
version = "0.1.0"
description = "Genesis Radar · FastAPI backend + 3 agentes do motor (MATCHER, ESTIMATOR, ARCHETYPIST). Nome do pacote mantido por compatibilidade com setups existentes."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "polars>=1.12",
    "pyarrow>=18",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sse-starlette>=2.1",
    "tzdata>=2024.2",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dealflow_api"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
